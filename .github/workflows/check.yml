# Pull requests from forks run here with no secrets (pull_request, never pull_request_target)
# and read-only access. First-time contributors wait for the owner to approve the run.
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to exact commits, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4

      # The guard runs from the main branch's copy, so a pull request cannot weaken its own check.
      - name: Guard
        run: |
          git show origin/${{ github.base_ref }}:scripts/guard.mjs > /tmp/guard.mjs
          node /tmp/guard.mjs origin/${{ github.base_ref }}

      - run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck
